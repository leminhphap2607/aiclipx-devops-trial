name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: 'Task definition revision (or "previous")'
        required: true
        default: 'previous'

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Determine revision to rollback to
        id: get-revision
        run: |
          if [ "${{ github.event.inputs.revision }}" = "previous" ]; then
            # Get current and previous task definitions
            REVISIONS=$(aws ecs list-task-definitions \
              --family-prefix aiclipx-task \
              --sort DESC \
              --query 'taskDefinitionArns' \
              --output text)
            
            CURRENT=$(echo $REVISIONS | awk '{print $1}')
            PREVIOUS=$(echo $REVISIONS | awk '{print $2}')
            
            echo "CURRENT_REVISION=$CURRENT" >> $GITHUB_OUTPUT
            echo "ROLLBACK_REVISION=$PREVIOUS" >> $GITHUB_OUTPUT
          else
            echo "ROLLBACK_REVISION=${{ github.event.inputs.revision }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Execute rollback
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition ${{ steps.get-revision.outputs.ROLLBACK_REVISION }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
      
      - name: Verify rollback
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}
          
          echo "✅ Rollback completed successfully"