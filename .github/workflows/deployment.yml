name: CICD

on:
  push:
    branches: [ trials-devops ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      AWS_REGION: ${{ secrets.AWS_Region }}
      ENV: ${{ secrets.ENV }}
      ECS_CLUSTER: aiclipx-${{ secrets.ENV }}
      ECS_SERVICE: aiclipx-${{ secrets.ENV }}
      TASK_FAMILY: aiclipx-${{ secrets.ENV }}
      CONTAINER_NAME: aiclipx-${{ secrets.ENV }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      # Setup Node & Test
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: application-example

      - name: Run tests
        run: npm test
        working-directory: application-example

      # AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_Region }}

      # Login ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build & Push image
      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Infrastructure/Dockerfile \
            -t $ECR_REGISTRY/aiclipx/${ENV}:${IMAGE_TAG} \
            application-example

          docker push $ECR_REGISTRY/aiclipx/${ENV}:${IMAGE_TAG}

          echo "image=$ECR_REGISTRY/aiclipx/${ENV}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # Lấy task definition hiện tại
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${TASK_FAMILY} \
            --query taskDefinition \
            --region ${AWS_REGION} \
          | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )' > task-definition.json

      # Render image mới
      - name: Render new task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Register revision mới
      - name: Register new task definition
        id: register-task
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      # Update service sang revision mới nhất
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${TASK_DEF_ARN} \
            --region ${AWS_REGION}

      # Wait deployment ổn định
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --region ${AWS_REGION}
