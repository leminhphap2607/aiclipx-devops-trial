name: CI - Build and Test

on:
  push:
    branches: [trials-devops]
  pull_request:
    branches: [trials-devops]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          cd src
          python -m pytest test_app.py --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./src/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/trials-devops'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 🔥 FIXED: Dùng ENV variables thay vì aws configure set
      - name: Setup AWS credentials via ENV
        run: |
          # Cách 1: Dùng export (hoạt động tốt nhất)
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"
          
          # Kiểm tra
          echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
          
          # Test AWS credentials
          aws sts get-caller-identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      
      # 🔥 FIXED: Login ECR với ENV đã set
      - name: Login to Amazon ECR
        run: |
          # Dùng AWS_DEFAULT_REGION từ ENV
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login \
            --username AWS \
            --password-stdin ${{ secrets.ECR_REGISTRY }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      
      # 🔥 FIXED: Build image với tag đúng format
      - name: Build Docker image
        run: |
          cd src
          # Build với commit SHA tag
          docker build -t ${{ secrets.ECR_REGISTRY }}:${{ github.sha }} .
          # Tag thêm latest
          docker tag ${{ secrets.ECR_REGISTRY }}:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}:latest
      
      # 🔥 FIXED: Push cả 2 tags
      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}:latest
      
      - name: Log success
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Image: ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}"
          echo "🏷️ Tags: latest, ${{ github.sha }}"
          echo "🔗 Registry: ${{ secrets.ECR_REGISTRY }}"