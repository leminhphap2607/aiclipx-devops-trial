name: CI - Build and Test

on:
  push:
    branches: [trials-devops]
  pull_request:
    branches: [trials-devops]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          cd src
          python -m pytest test_app.py --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./src/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/trials-devops'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 🔥 FIX 1: Tạo AWS config file với region cứng
      - name: Setup AWS configuration
        run: |
          mkdir -p ~/.aws
          
          # Tạo config file
          cat > ~/.aws/config << EOF
[default]
region = ap-southeast-1
output = json
EOF
          
          # Tạo credentials file
          cat > ~/.aws/credentials << EOF
[default]
aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
EOF
          
          # Test credentials
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "✅ AWS configured successfully"
      
      # 🔥 FIX 2: Login ECR với region cứng
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
      
      # 🔥 FIX 3: Build với đúng tag format
      - name: Build Docker image
        run: |
          cd src
          echo "Building Docker image..."
          docker build -t ${{ secrets.ECR_REGISTRY }}:${{ github.sha }} .
          docker tag ${{ secrets.ECR_REGISTRY }}:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}:latest
          echo "✅ Build completed"
      
      # 🔥 FIX 4: Push image
      - name: Push Docker image
        run: |
          echo "Pushing images to ECR..."
          docker push ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}:latest
          echo "✅ Push completed"
      
      - name: Log success
        run: |
          echo "🎉 CI/CD Pipeline SUCCESS!"
          echo "========================"
          echo "📦 Registry: ${{ secrets.ECR_REGISTRY }}"
          echo "🏷️ Image Tags:"
          echo "   - ${{ github.sha }}"
          echo "   - latest"
          echo "📍 Region: ap-southeast-1"
          echo "🕐 Timestamp: $(date -u)"