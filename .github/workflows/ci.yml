name: CI - Build and Test

on:
  push:
    branches: [trials-devops]
  pull_request:
    branches: [trials-devops]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          cd src
          python -m pytest test_app.py --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./src/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/trials-devops'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 🔥 FIXED: AWS config với region cứng và đúng format
      - name: Configure AWS credentials
        run: |
          # Tạo thư mục .aws
          mkdir -p ~/.aws
          
          # Tạo config file với region đúng
          cat > ~/.aws/config << 'EOF'
[default]
region = ap-southeast-1
output = json
EOF
          
          # Tạo credentials file
          cat > ~/.aws/credentials << EOF
[default]
aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
EOF
          
          # Kiểm tra file
          echo "=== AWS Config ==="
          cat ~/.aws/config
          echo ""
          echo "=== AWS Credentials ==="
          # Ẩn secret key, chỉ hiển thị độ dài
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}"
          echo "aws_secret_access_key = [HIDDEN] (length: ${#{{ secrets.AWS_SECRET_ACCESS_KEY }}})"
          
          # Test AWS credentials
          echo ""
          echo "=== Testing AWS credentials ==="
          aws sts get-caller-identity
          echo "✅ AWS credentials configured successfully!"
      
      # 🔥 FIXED: Login ECR với registry đúng
      - name: Login to Amazon ECR
        run: |
          ECR_REGISTRY="718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app"
          echo "Logging into ECR: $ECR_REGISTRY"
          
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin "718281698048.dkr.ecr.ap-southeast-1.amazonaws.com"
          echo "✅ Logged into ECR successfully!"
      
      # 🔥 FIXED: Build với đúng tag
      - name: Build Docker image
        run: |
          cd src
          IMAGE_TAG="718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:${{ github.sha }}"
          IMAGE_LATEST="718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:latest"
          
          echo "Building Docker image..."
          echo "Image tag: $IMAGE_TAG"
          echo "Latest tag: $IMAGE_LATEST"
          
          docker build -t "$IMAGE_TAG" .
          docker tag "$IMAGE_TAG" "$IMAGE_LATEST"
          
          echo "✅ Docker build completed!"
          docker images | grep "718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app"
      
      # 🔥 FIXED: Push với đúng registry
      - name: Push Docker image
        run: |
          IMAGE_TAG="718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:${{ github.sha }}"
          IMAGE_LATEST="718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:latest"
          
          echo "Pushing images to ECR..."
          echo "Pushing: $IMAGE_TAG"
          docker push "$IMAGE_TAG"
          
          echo "Pushing: $IMAGE_LATEST"
          docker push "$IMAGE_LATEST"
          
          echo "✅ All images pushed successfully!"
      
      - name: Success message
        run: |
          echo "🎉🎉🎉 CI/CD PIPELINE COMPLETED SUCCESSFULLY! 🎉🎉🎉"
          echo "=============================================="
          echo "📦 ECR Registry: 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com"
          echo "📁 Repository: aiclipx-app"
          echo "🏷️ Image Tags:"
          echo "   - ${{ github.sha }}"
          echo "   - latest"
          echo "📍 AWS Region: ap-southeast-1"
          echo "⏰ Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=============================================="