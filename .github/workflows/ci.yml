name: CI - Build and Test

on:
  push:
    branches: [trials-devops]
  pull_request:
    branches: [trials-devops]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          cd src
          python -m pytest test_app.py --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./src/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/trials-devops'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
      
      - name: Configure AWS
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/config
          echo "region = ap-southeast-1" >> ~/.aws/config
          echo "output = json" >> ~/.aws/config
          
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
      
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com
      
      - name: Build Docker image
        run: |
          cd src
          docker build -t 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:${{ github.sha }} .
          docker tag 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:${{ github.sha }} 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:latest
      
      - name: Push Docker image
        run: |
          docker push 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:${{ github.sha }}
          docker push 718281698048.dkr.ecr.ap-southeast-1.amazonaws.com/aiclipx-app:latest
      
      - name: Success
        run: |
          echo "✅ CI/CD completed successfully!"