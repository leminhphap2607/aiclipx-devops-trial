name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    branches: [trials-devops]
    types: [completed]

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Staging-${{ github.run_id }}
          
      - name: Download task definition template
        run: |
          cp infrastructure/ecs/task-definition.json infrastructure/ecs/task-definition-staging.json
          
      - name: Replace placeholders in task definition
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}:${{ github.event.workflow_run.head_sha }}"
          sed -i "s|TAG_PLACEHOLDER|${{ github.event.workflow_run.head_sha }}|g" infrastructure/ecs/task-definition-staging.json
          sed -i "s|ACCOUNT_ID_PLACEHOLDER|$(aws sts get-caller-identity --query Account --output text)|g" infrastructure/ecs/task-definition-staging.json
          
      - name: Register task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://infrastructure/ecs/task-definition-staging.json \
            --region ${{ secrets.AWS_REGION }}
            
      - name: Deploy to ECS
        run: |
          # Register new task definition and get ARN
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://infrastructure/ecs/task-definition-staging.json \
            --region ${{ secrets.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New task definition ARN: $TASK_DEF_ARN"
          
          # Update ECS service with exact task definition ARN
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
            
      - name: Wait for deployment to complete
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}
            
      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Checking service status..."
          aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'services[0].[status,runningCount,desiredCount]'