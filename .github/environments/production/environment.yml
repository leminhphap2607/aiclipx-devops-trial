# Production environment configuration
deployment_branch_policy:
  protected_branches: false
  custom_branch_policies: true
  
environment_url: https://app.aiclipx.com

# Required reviewers for production deployment
reviewers:
  - devops-team
  - cto

# Required environment variables (set in GitHub UI)
# - ECS_CLUSTER: aiclipx-production
# - ECS_SERVICE: aiclipx-service

# Wait timer before deployment (in minutes)
wait_timer: 2